name: Deploy to Test
on:
  push:
    branches: [promotion/test]

env:
  REGISTRY: image-registry.openshift-image-registry.svc:5000
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_TEST_NAMESPACE: 6cdc9e-test
  IMAGE_NAME: eagle-public
  PROD_PROMO_BRANCH: promotion/prod
  PROD_PROMO_PR_BRANCH: promotion/prod-pr

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-24.04
    outputs:
      COMMIT_SHA: ${{ steps.read-hash.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "promotion/test"

      - name: Retrieve commit hash
        id: read-hash
        run: echo "SHA=$(jq -r '.commit' state.json)" >> $GITHUB_OUTPUT

      - name: Install OpenShift CLI
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Tag image for Test
        run: |
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.read-hash.outputs.SHA }} \
                 ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:test

      - name: Checkout develop for Helm charts
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to Test with Helm
        run: |
          helm upgrade --install eagle-public ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_TEST_NAMESPACE }} \
            --values ./helm/eagle-public/values-test.yaml \
            --set image.tag=${{ steps.read-hash.outputs.SHA }} \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/eagle-public -n ${{ env.OPENSHIFT_TEST_NAMESPACE }} --timeout=120s

      - name: Notify Rocket.Chat
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data '{"alias":"Bot","avatar":"https://github.githubassets.com/images/modules/logos_page/Octocat.png","text":"✅ Commit ${{ steps.read-hash.outputs.SHA }} deployed to eagle-public Test"}' \
            ${{ secrets.ROCKET_CHAT_URL }}

  sync-test-branch:
    name: Sync test branch
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: "test"
          fetch-depth: 0

      - name: Rebase from commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin develop
          git rebase ${{ needs.deploy.outputs.COMMIT_SHA }} test
          git push origin test --force-with-lease

  promotion:
    name: Create Prod Promotion PR
    needs: [deploy, sync-test-branch]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion/prod
        uses: actions/checkout@v4
        with:
          ref: "${{ env.PROD_PROMO_BRANCH }}"

      - name: Update state.json
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git checkout -B ${{ env.PROD_PROMO_PR_BRANCH }}
          git reset --hard ${{ env.PROD_PROMO_BRANCH }}

          echo $(jq '.commit="${{ needs.deploy.outputs.COMMIT_SHA }}"' state.json) > state.json

          git commit -am "Promote commit ${{ needs.deploy.outputs.COMMIT_SHA }} to Prod"
          git push --force origin ${{ env.PROD_PROMO_PR_BRANCH }}

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.PROD_PROMO_PR_BRANCH }}
          destination_branch: ${{ env.PROD_PROMO_BRANCH }}
          pr_title: "Deploy to Production"
          pr_body: |
            :crown: *An automated PR*

            This PR triggers a deployment to Production once merged.
            
            **Commit:** ${{ needs.deploy.outputs.COMMIT_SHA }}
          pr_label: "auto-pr,prod env,pipeline"
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
