name: Deploy to Test

on:
  workflow_dispatch:

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: eagle-public
  APP_NAME: eagle-public

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE_TOOLS }}

      - name: Tag image for test
        run: |
          echo "Backing up current test image..."
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag --reference-policy='local' \
            ${{ env.IMAGE_NAME }}:test ${{ env.IMAGE_NAME }}:test-backup || true
          
          echo "Tagging ci-latest as test..."
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag --reference-policy='local' \
            ${{ env.IMAGE_NAME }}:ci-latest ${{ env.IMAGE_NAME }}:test

      - name: Deploy with Helm
        run: |
          oc project ${{ env.OPENSHIFT_NAMESPACE_TEST }}
          
          helm upgrade --install ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            --values ./helm/${{ env.APP_NAME }}/values-test.yaml \
            --set image.tag=test \
            --wait --timeout=5m
          
          echo "Restarting deployment to pull updated image..."
          oc rollout restart deployment/${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE_TEST }}

      - name: Verify deployment
        run: |
          echo "Waiting for rollout to complete..."
          oc rollout status deployment/${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} --timeout=5m
          
          echo "Deployment successful!"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} -l app.kubernetes.io/name=${{ env.APP_NAME }}
