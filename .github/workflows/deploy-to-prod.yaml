name: Deploy to Prod
on:
  push:
    branches: [promotion/prod]

env:
  REGISTRY: image-registry.openshift-image-registry.svc:5000
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_PROD_NAMESPACE: 6cdc9e-prod
  IMAGE_NAME: eagle-public

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      COMMIT_SHA: ${{ steps.read-hash.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "promotion/prod"

      - name: Retrieve commit hash
        id: read-hash
        run: echo "SHA=$(jq -r '.commit' state.json)" >> $GITHUB_OUTPUT

      - name: Install OpenShift CLI
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Tag image for Prod
        run: |
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.read-hash.outputs.SHA }} \
                 ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:prod

      - name: Checkout develop for Helm charts
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to Prod with Helm
        run: |
          helm upgrade --install eagle-public ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_PROD_NAMESPACE }} \
            --values ./helm/eagle-public/values-prod.yaml \
            --set image.tag=${{ steps.read-hash.outputs.SHA }} \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/eagle-public -n ${{ env.OPENSHIFT_PROD_NAMESPACE }} --timeout=120s

      - name: Notify Rocket.Chat
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data '{"alias":"Bot","avatar":"https://github.githubassets.com/images/modules/logos_page/Octocat.png","text":"🚀 Commit ${{ steps.read-hash.outputs.SHA }} deployed to eagle-public PRODUCTION"}' \
            ${{ secrets.ROCKET_CHAT_URL }}

  sync-main-branch:
    name: Sync main branch
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: "main"
          fetch-depth: 0

      - name: Rebase from commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin develop
          git rebase ${{ needs.deploy.outputs.COMMIT_SHA }} main
          git push origin main --force-with-lease
