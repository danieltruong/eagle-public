# =============================================================================
# Deploy to Production
# =============================================================================
# Manually triggered workflow to deploy to production environment.
# Uses workflow_dispatch with optional image_tag input.
# Defaults to promoting the 'test' tagged image.
# =============================================================================

name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (commit SHA or "test")'
        required: false
        default: 'test'
        type: string

permissions: write-all

env:
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_PROD_NAMESPACE: 6cdc9e-prod
  IMAGE_NAME: eagle-public

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set image tag
        id: image-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "test" ]; then
            echo "Using 'test' tag"
            echo "TAG=test" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: $TAG"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Install OpenShift CLI
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Tag image for Prod
        run: |
          echo "Tagging image ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }} as 'prod'"
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }} \
                 ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:prod

      - name: Deploy to Prod with Helm
        run: |
          helm upgrade --install eagle-public ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_PROD_NAMESPACE }} \
            --values ./helm/eagle-public/values-prod.yaml \
            --set image.tag=${{ steps.image-tag.outputs.TAG }} \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/eagle-public -n ${{ env.OPENSHIFT_PROD_NAMESPACE }} --timeout=120s
          
          echo "Checking pod health..."
          kubectl get pods -n ${{ env.OPENSHIFT_PROD_NAMESPACE }} -l app.kubernetes.io/name=eagle-public

      - name: Notify Rocket.Chat
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -X POST -H 'Content-Type: application/json' \
              --data '{"alias":"GitHub Actions","avatar":"https://github.githubassets.com/images/modules/logos_page/Octocat.png","text":"🚀 eagle-public deployed to **PRODUCTION** with tag: `${{ steps.image-tag.outputs.TAG }}`"}' \
              ${{ secrets.ROCKET_CHAT_URL }} || true
          else
            curl -X POST -H 'Content-Type: application/json' \
              --data '{"alias":"GitHub Actions","avatar":"https://github.githubassets.com/images/modules/logos_page/Octocat.png","text":"🔥 eagle-public deployment to **PRODUCTION** FAILED for tag: `${{ steps.image-tag.outputs.TAG }}`"}' \
              ${{ secrets.ROCKET_CHAT_URL }} || true
          fi

      - name: Summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | ${{ steps.image-tag.outputs.TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment Complete**" >> $GITHUB_STEP_SUMMARY
