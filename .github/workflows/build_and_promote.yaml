name: Build and Deploy to Dev
on:
  push:
    branches:
      - develop

env:
  REGISTRY: image-registry.openshift-image-registry.svc:5000
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_DEV_NAMESPACE: 6cdc9e-dev
  IMAGE_NAME: eagle-public
  TEST_PROMO_BRANCH: promotion/test
  TEST_PROMO_PR_BRANCH: promotion/test-pr

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Install OpenShift CLI
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Log into OpenShift Registry
        run: |
          oc registry login --to=/tmp/docker-config.json
          echo "DOCKER_CONFIG=/tmp" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHA }}
            ${{ env.REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to Dev with Helm
        run: |
          helm upgrade --install eagle-public ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_DEV_NAMESPACE }} \
            --values ./helm/eagle-public/values-dev.yaml \
            --set image.tag=${{ steps.short-sha.outputs.SHA }} \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/eagle-public -n ${{ env.OPENSHIFT_DEV_NAMESPACE }} --timeout=120s
          
          echo "Checking pod health..."
          kubectl get pods -n ${{ env.OPENSHIFT_DEV_NAMESPACE }} -l app.kubernetes.io/name=eagle-public

  promotion:
    name: Create Promotion Pull Request
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion/test
        uses: actions/checkout@v4
        with:
          ref: "${{ env.TEST_PROMO_BRANCH }}"

      - name: Update state.json
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git checkout -B ${{ env.TEST_PROMO_PR_BRANCH }}
          git reset --hard ${{ env.TEST_PROMO_BRANCH }}

          echo $(jq '.commit="${{ needs.build.outputs.SHORT_SHA }}"' state.json) > state.json

          git commit -am "Promote commit ${{ needs.build.outputs.SHORT_SHA }} to Test"
          git push --force origin ${{ env.TEST_PROMO_PR_BRANCH }}

      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.TEST_PROMO_PR_BRANCH }}
          destination_branch: ${{ env.TEST_PROMO_BRANCH }}
          pr_title: "Deploy to Test Environment"
          pr_body: |
            :crown: *An automated PR*

            This PR triggers a deployment to Test once it's fully merged.
            
            **Commit:** ${{ needs.build.outputs.SHORT_SHA }}
          pr_label: "auto-pr,test env,pipeline"
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
