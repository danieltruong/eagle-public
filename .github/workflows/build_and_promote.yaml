name: Build and Deploy to Dev
on:
  push:
    branches:
      - develop

env:
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_DEV_NAMESPACE: 6cdc9e-dev
  IMAGE_NAME: eagle-public
  TEST_PROMO_BRANCH: promotion/test
  TEST_PROMO_PR_BRANCH: promotion/test-pr

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits to compare changes

      - name: Get Short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Check if nginx config changed
        id: nginx-check
        run: |
          # Check if nginx-runtime config files changed in this commit
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "openshift/templates/nginx-runtime/"; then
            echo "Nginx config files changed"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No nginx config changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild nginx-runtime image (if changed)
        if: steps.nginx-check.outputs.changed == 'true'
        run: |
          echo "Nginx config changed, rebuilding nginx-runtime image..."
          oc start-build eagle-public-nginx-runtime -n ${{ env.OPENSHIFT_NAMESPACE }} --commit=${{ github.sha }} --wait --follow

      - name: Build Angular application
        run: |
          echo "Building Angular application from commit ${{ github.sha }}..."
          oc start-build eagle-public-angular-builder -n ${{ env.OPENSHIFT_NAMESPACE }} --commit=${{ github.sha }} --wait --follow

      - name: Build final image
        run: |
          echo "Building final eagle-public image..."
          oc start-build eagle-public-build -n ${{ env.OPENSHIFT_NAMESPACE }} --wait --follow

      - name: Tag image for dev deployment
        run: |
          echo "Tagging latest as dev to trigger deployment..."
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:dev

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          oc rollout status dc/${{ env.IMAGE_NAME }} -n ${{ env.OPENSHIFT_DEV_NAMESPACE }} --watch=true --timeout=300s

  promotion:
    name: Create Promotion Pull Request
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion/test
        uses: actions/checkout@v4
        with:
          ref: "${{ env.TEST_PROMO_BRANCH }}"
      - name: Update state.json
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{github.actor}}@users.noreply.github.com"

          git checkout -B ${{ env.TEST_PROMO_PR_BRANCH }}
          git reset --hard ${{ env.TEST_PROMO_BRANCH }}

          echo $(jq '.commit="${{ needs.build.outputs.SHORT_SHA }}"' state.json) > state.json

          git commit -am "Promote commit ${{ needs.build.outputs.SHORT_SHA }} to Test"
          git push --force origin ${{ env.TEST_PROMO_PR_BRANCH }}
      - name: Create Pull Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.TEST_PROMO_PR_BRANCH }}
          destination_branch: ${{ env.TEST_PROMO_BRANCH }}
          pr_title: "Deploy to Test Environment"
          pr_body: |
            :crown: *An automated PR*

            This PR triggers an deployment to Test once it's fully merged.
          pr_label: "auto-pr,test env,pipeline"
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
