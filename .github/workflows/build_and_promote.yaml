# =============================================================================
# Build and Deploy to Dev
# =============================================================================
# Triggered on push to develop branch.
# Builds Docker image, pushes to OpenShift registry, deploys to dev namespace.
# =============================================================================

name: Build and Deploy to Dev

on:
  push:
    branches:
      - develop

permissions: write-all

env:
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_DEV_NAMESPACE: 6cdc9e-dev
  IMAGE_NAME: eagle-public

jobs:
  build:
    name: Build and Deploy to Dev
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install OpenShift CLI
        run: |
          curl -sLO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Login to OpenShift registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OPENSHIFT_REPOSITORY }}
          username: ${{ secrets.OPENSHIFT_REPOSITORY_USERNAME }}
          password: ${{ secrets.OPENSHIFT_REPOSITORY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHA }}
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:dev
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_DEV_NAMESPACE }}

      - name: Deploy to Dev with Helm
        run: |
          helm upgrade --install eagle-public ./helm/eagle-public \
            --namespace ${{ env.OPENSHIFT_DEV_NAMESPACE }} \
            --values ./helm/eagle-public/values-dev.yaml \
            --set image.tag=${{ steps.short-sha.outputs.SHA }} \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/eagle-public -n ${{ env.OPENSHIFT_DEV_NAMESPACE }} --timeout=120s
          
          echo "Checking pod health..."
          kubectl get pods -n ${{ env.OPENSHIFT_DEV_NAMESPACE }} -l app.kubernetes.io/name=eagle-public

      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ steps.short-sha.outputs.SHA }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | ${{ steps.short-sha.outputs.SHA }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To deploy to Test, manually trigger the **Deploy to Test** workflow with image tag: \`${{ steps.short-sha.outputs.SHA }}\`" >> $GITHUB_STEP_SUMMARY
